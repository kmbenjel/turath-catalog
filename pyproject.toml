[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "turath-catalog"
version = "0.2.0"
description = "Open bibliographic dataset of classical Arabic works and their printed editions (works, editions, authors with death years, editors, manuscripts), with the tools that build and validate it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
requires-python = ">=3.10"
authors = [{ name = "Khalid Benjelloun" }]
keywords = ["arabic", "bibliography", "dataset", "turath", "manuscripts", "openiti", "wikidata", "digital-humanities", "islamic-studies"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: Arabic",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Sociology :: History",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
charts = ["matplotlib>=3.7"]
pandas = ["pandas>=2.0", "pyarrow>=14"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4.21", "pyarrow>=14", "matplotlib>=3.7"]

[project.scripts]
turath-catalog = "turath_catalog.cli:main"

[project.urls]
Homepage = "https://github.com/kmbenjel/turath-catalog"
Documentation = "https://warraq.benjelloun.dev/turath-catalog/"
Issues = "https://github.com/kmbenjel/turath-catalog/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/turath_catalog"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "schema", "docs/data-dictionary.md", "README.md", "LICENSE", "LICENSE-DATA", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "E731", "SIM108", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["turath_catalog"]
branch = true
