name: Bug in the tools
description: turath-catalog build/validate/charts misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: turath-catalog --version, Python version, OS
